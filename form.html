<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 – Form Webpage</title>
    <meta name="description"
      content="WDD 131 – Form Webpage of Miguel J. Subero Saballo for BYU-IDAHO">
    <meta name="author" content="Miguel J. Subero Saballo">
    <script src="scripts/form.js" defer></script>
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
    <header><h1>Product Review</h1></header>

    <form action="review.html" method="get" id="newform">

            <div class="day"><label for="product">Product Name</label>
            <select name="product" id="product" class="product" required>
                <option value="" selected disabled>Select a Product...</option>
            </select></div>
            

            <p>Overall Rating</p>

            <div class="rate">

            <div class="starcheck right"><label for="1star">☆</label>
            <input type="radio" id="1star" name="stars" value="stars" required></div>
            
            <div class="starcheck"><label for="2star">☆☆</label>
            <input type="radio" id="2star" name="stars" value="stars" required></div>
            
            <div class="starcheck"><label for="3star">☆☆☆</label>
            <input type="radio" id="3star" name="stars" value="stars" required></div>
            
            <div class="starcheck"><label for="4star">☆☆☆☆</label>
            <input type="radio" id="4star" name="stars" value="stars" required></div>
            
            <div class="starcheck"><label for="5star">☆☆☆☆☆</label>
            <input type="radio" id="5star" name="stars" value="stars" required></div></div>

            <div class="day">
                <label for="date">Date of Installation</label>
                <input type="date" id="date" name="date" class="date">
            </div>
            
            <p>Which features did you find useful in the product? <br>(Select all that apply)</p>

            <div>
                <input type="checkbox" id="durability" name="durability" value="yes">
                <label for="durability">Durability</label>
            </div>

            <div>
                <input type="checkbox" id="ease" name="ease" value="yes">
                <label for="ease">Ease of Use</label>
            </div>

            <div><input type="checkbox" id="performance" name="performance" value="yes">
                <label for="performance">Performance</label>
            </div>

            <div>
                <input type="checkbox" id="design" name="design" value="yes">
                <label for="design">Design</label>
            </div>
            
            <div class="textbox">
                <label for="write">Written Review (Optional)</label>
                <textarea class="area" name="write" id="write"></textarea>
            </div>
            
            <div class="textbox user"><label for="user">Your Name (Optional)</label>
            <input type="text" id="user" name="user"></div>
            
            <input type="submit" value="Post Review">
            
        </form>

    <footer><p>©<span id="currentyear"></span>— Miguel J. Subero Saballo — Brasil</p>
    <p>Last Modified:<span id="lastmodified"></span></p></footer>
</body>
</html>
